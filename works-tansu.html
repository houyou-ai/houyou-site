<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>箪笥｜ご紹介している作品｜豊陽株式会社</title>

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      color: #222;
    }

    header {
      padding: 80px 120px 40px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      font-size: 32px;
      letter-spacing: 6px;
      margin-bottom: 12px;
    }

    .jp-sub {
      font-size: 13px;
      opacity: 0.5;
    }

    main {
      padding: 80px 120px 120px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 40px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #555;
      text-decoration: none;
      opacity: 0.7;
    }

    .back-link:hover {
      opacity: 1;
    }

    /* ===== 作品列表 ===== */

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
    }

    .work-card {
      background-color: #fff;
      border: 1px solid #eee;
      text-decoration: none;
      color: #222;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      overflow: hidden;
    }

    .work-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 48px rgba(0,0,0,0.1);
    }

    .work-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .work-card:hover img {
      transform: scale(1.05);
    }

    .work-info {
      padding: 20px 20px 28px;
    }

    .work-info h2 {
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .work-info p {
      font-size: 13px;
      opacity: 0.6;
      line-height: 1.7;
    }

    /* ===== 手机端 ===== */
    @media (max-width: 768px) {

      header {
        padding: 40px 20px 24px;
      }

      header h1 {
        font-size: 24px;
        letter-spacing: 4px;
      }

      main {
        padding: 40px 20px 80px;
      }

      .works-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .work-card img {
        height: 200px;
      }

      .work-info h2 {
        font-size: 16px;
      }
    }

  </style>
</head>

<body>

<header>
  <h1>箪笥</h1>
  <p class="jp-sub">船箪笥・衣装箪笥・商家箪笥</p>
</header>

<main>

  <a href="works.html" class="back-link">← カテゴリー一覧へ戻る</a>

  <section class="works-grid">

    <div class="work-card">
      <img src="images/401.jpg" alt="箪笥 作品1">
      <div class="work-info">
        <h2>作品名（仮）</h2>
        <p>江戸期の意匠を残す箪笥。保存状態良好。</p>
      </div>
    </div>

    <div class="work-card">
      <img src="images/402.jpg" alt="箪笥 作品2">
      <div class="work-info">
        <h2>作品名（仮）</h2>
        <p>重厚な金具が特徴的な商家箪笥。</p>
      </div>
    </div>

    <div class="work-card">
      <img src="images/403.jpg" alt="箪笥 作品3">
      <div class="work-info">
        <h2>作品名（仮）</h2>
        <p>船箪笥特有の実用性と美しさを備えた一品。</p>
      </div>
    </div>

  </section>

</main>

</body>
</html>
