<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>作品カテゴリー｜豊陽株式会社</title>

  <style>
    /* ===== 基础设置 ===== */
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      color: #222;
    }

    header {
      padding: 80px 120px 40px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      font-size: 32px;
      letter-spacing: 6px;
      margin-bottom: 12px;
    }

    .jp-sub {
      font-size: 13px;
      opacity: 0.5;
    }

    main {
      padding: 80px 120px;
    }

    /* ===== 分类布局 ===== */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      margin-top: 80px;
    }

    /* ===== 分类卡片 ===== */
    .category-card {
      position: relative;
      height: 360px;
      overflow: hidden;
      text-decoration: none;
      color: #222;
      border: 1px solid #eee;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    /* 背景图层 */
    .category-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.35;
      transform: scale(1.05);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    .category-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
}

    /* 不同分类的图片 */
/* 不同分类的背景图片（测试用） */
.category-card.tansu .category-bg {
  background-image: url("images/4.jpg");
}

.category-card.tategu .category-bg {
  background-image: url("images/5.jpg");
}

.category-card.komingu .category-bg {
  background-image: url("images/6.jpg");
}


    /* 文字层 */
    .category-text {
      position: absolute;
      bottom: 32px;
      left: 32px;
      z-index: 2;
    }

    .category-text h2 {
      font-size: 24px;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .category-text p {
      font-size: 13px;
      opacity: 0.8;
    }

    /* Hover 动画 */
    .category-card:hover .category-bg {
      opacity: 1;
      transform: scale(1);
    }

    .category-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 56px rgba(0,0,0,0.15);
      
    }

    /* Hover 时文字变为白色（配合背景图） */
.category-card:hover .category-text {
  color: #fff;
}

    /* ===== 手机端 ===== */
    @media (max-width: 768px) {
      header {
        padding: 40px 20px 24px;
      }

      main {
        padding: 40px 20px;
      }

      .category-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .category-card {
        height: 220px;
      }

      .category-text {
        bottom: 20px;
        left: 20px;
      }

      .category-text h2 {
        font-size: 18px;
        letter-spacing: 3px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ご紹介している作品</h1>
  <p class="jp-sub">カテゴリー別にご覧いただけます</p>
</header>

<main>
  <section class="category-grid">

    <a href="works-tansu.html" class="category-card tansu">
      <div class="category-bg"></div>
      <div class="category-text">
        <h2>箪笥</h2>
        <p>船箪笥・衣装箪笥・商家箪笥</p>
      </div>
    </a>

    <a href="works-tategu.html" class="category-card tategu">
      <div class="category-bg"></div>
      <div class="category-text">
        <h2>建具</h2>
        <p>襖・障子・欄間</p>
      </div>
    </a>

    <a href="works-komingu.html" class="category-card komingu">
      <div class="category-bg"></div>
      <div class="category-text">
        <h2>古民具</h2>
        <p>生活道具・店舗什器・信仰具</p>
      </div>
    </a>

  </section>
</main>

</body>
</html>
