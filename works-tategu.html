<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>建具｜豊陽株式会社</title>

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f2f2;
      color: #222;
    }

    .hero {
      position: relative;
      height: 60vh;
      background-image: url("images/5.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
    }

    .hero-text {
      position: relative;
      z-index: 2;
      padding-left: 120px;
      color: #fff;
    }

    .hero-text h1 {
      font-size: 48px;
      letter-spacing: 8px;
      margin-bottom: 12px;
    }

    .hero-text p {
      font-size: 14px;
      letter-spacing: 2px;
      opacity: 0.85;
    }

    main {
      padding: 120px;
    }

    .section-title {
      font-size: 24px;
      letter-spacing: 4px;
      margin-bottom: 48px;
    }

    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
    }

    .work-item img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .work-item:hover img {
      transform: scale(1.04);
    }

    .work-caption {
      margin-top: 16px;
      font-size: 13px;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    .back-link {
      display: inline-block;
      margin-top: 120px;
      font-size: 13px;
      letter-spacing: 2px;
      text-decoration: none;
      color: #222;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
    }

    @media (max-width: 768px) {
      .hero {
        height: 38vh;
      }

      .hero-text {
        padding-left: 24px;
      }

      .hero-text h1 {
        font-size: 32px;
        letter-spacing: 4px;
      }

      main {
        padding: 40px 20px;
      }

      .works-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .work-item img {
        height: 320px;
      }
      
    .back-link {
    margin-top: 64px;
  }
  
    }
  </style>
</head>

<body>

<section class="hero">
  <div class="hero-text">
    <h1>建具</h1>
    <p>襖・障子・欄間</p>
  </div>
</section>

<main>
  <h2 class="section-title">Selected Works</h2>

  <div class="works-grid">
    <div class="work-item">
      <img src="images/5.jpg" alt="建具 作品1">
      <div class="work-caption">江戸期 襖</div>
    </div>

    <div class="work-item">
      <img src="images/5.jpg" alt="建具 作品2">
      <div class="work-caption">明治期 障子</div>
    </div>

    <div class="work-item">
      <img src="images/5.jpg" alt="建具 作品3">
      <div class="work-caption">欄間彫刻</div>
    </div>
  </div>

  <a href="works.html" class="back-link">← カテゴリー一覧へ戻る</a>
</main>

</body>
</html>
