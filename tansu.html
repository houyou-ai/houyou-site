<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>箪笥｜豊陽株式会社</title>

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f2f2;
      color: #222;
    }

    /* ===== 顶部分类视觉区（这是和上一页最关键的区别） ===== */
    .hero {
      position: relative;
      height: 60vh;
      background-image: url("images/401.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
    }

    .hero-text {
      position: relative;
      z-index: 2;
      padding-left: 120px;
      color: #fff;
    }

    .hero-text h1 {
      font-size: 48px;
      letter-spacing: 8px;
      margin-bottom: 12px;
    }

    .hero-text p {
      font-size: 14px;
      letter-spacing: 2px;
      opacity: 0.85;
    }

    /* ===== 内容区 ===== */
    main {
      padding: 120px;
    }

    .section-title {
      font-size: 24px;
      letter-spacing: 4px;
      margin-bottom: 48px;
    }

    /* ===== 图片展示（不像分类页的“卡片”） ===== */
    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
    }

    .work-item img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .work-item:hover img {
      transform: scale(1.04);
    }

    .work-caption {
      margin-top: 16px;
      font-size: 13px;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    /* ===== 返回按钮 ===== */
    .back-link {
      display: inline-block;
      margin-top: 120px;
      font-size: 13px;
      letter-spacing: 2px;
      text-decoration: none;
      color: #222;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
    }

    /* ===== 手机端 ===== */
    @media (max-width: 768px) {
      .hero {
        height: 45vh;
      }

      .hero-text {
        padding-left: 24px;
      }

      .hero-text h1 {
        font-size: 32px;
        letter-spacing: 6px;
      }

      main {
        padding: 40px 20px;
      }

      .works-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .work-item img {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<!-- ===== 分类页头区 ===== -->
<section class="hero">
  <div class="hero-text">
    <h1>箪笥</h1>
    <p>船箪笥・衣装箪笥・商家箪笥</p>
  </div>
</section>

<!-- ===== 内容 ===== -->
<main>
  <h2 class="section-title">Selected Works</h2>

  <div class="works-grid">
    <div class="work-item">
      <img src="images/401.jpg" alt="箪笥 作品1">
      <div class="work-caption">江戸期 船箪笥</div>
    </div>

    <div class="work-item">
      <img src="images/402.jpg" alt="箪笥 作品2">
      <div class="work-caption">明治期 衣装箪笥</div>
    </div>

    <div class="work-item">
      <img src="images/403.jpg" alt="箪笥 作品3">
      <div class="work-caption">商家箪笥</div>
    </div>
  </div>

  <a href="index.html" class="back-link">← カテゴリー一覧へ戻る</a>
</main>

</body>
</html>
